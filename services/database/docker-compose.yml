# =============================================================================
# Club360 — capa de base de datos (un contenedor) + migrate one-shot
#
# Contenedor `db`:
#   - MariaDB (datos en volumen Docker)
#   - Backups semanales (domingo 03:00 UTC) → ../../Backups en el host
#
# Contenedor `prisma-migrate` (one-shot, no queda corriendo):
#   - Aplica backend/prisma/migrations al subir el stack
#
# La app (API/frontend) corre FUERA de este compose (npm run api / npm run web)
# o en deploy/ aparte.
#
# Uso:
#   docker compose up -d
#   npm run db:backup          # dump inmediato → Backups/
# =============================================================================

name: club360-database

services:
  db:
    build:
      context: ../..
      dockerfile: services/database/Dockerfile.db
    container_name: club360-db
    hostname: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-club360}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      DB_NAME: ${MARIADB_DATABASE:-club360}
      BACKUP_DIR: /backups
      RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-8}
      BACKUPS_ENABLED: ${BACKUPS_ENABLED:-true}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - club360_mariadb_data:/var/lib/mysql
      # Dumps fuera de Docker → raíz del repo
      - ../../Backups:/backups
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mariadb-admin ping -h 127.0.0.1 -uroot -p"$$MARIADB_ROOT_PASSWORD" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      club360-db:
        aliases:
          - mariadb
    restart: unless-stopped

  # One-shot: aplica migraciones Prisma y sale (no es un servicio permanente)
  prisma-migrate:
    build:
      context: ../..
      dockerfile: services/database/Dockerfile.migrate
    container_name: club360-prisma-migrate
    environment:
      DATABASE_URL: mysql://root:${MARIADB_ROOT_PASSWORD:-root}@db:3306/${MARIADB_DATABASE:-club360}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    networks:
      - club360-db

volumes:
  club360_mariadb_data:
    name: club360_mariadb_data

networks:
  club360-db:
    name: club360-db
