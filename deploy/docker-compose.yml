# Club360 — stack completo para VPS / pruebas locales con Docker
#
# Uso (desde deploy/):
#   cp .env.example .env    # editar JWT_SECRET, contraseñas y FRONTEND_URL
#   docker compose up -d --build
#
# Accesos por defecto (ajustar en .env):
#   App:        http://<host>:8080
#   Portainer:  http://<host>:9000   (gestión visual de contenedores)
#
# Primera subida: contenedor `db` (MariaDB + backups) + wizard/migrate aplica esquema.

name: club360

services:
  # Contenedor único de BD: MariaDB + backups semanales → ../Backups (host)
  db:
    build:
      context: ..
      dockerfile: services/database/Dockerfile.db
    container_name: club360-db
    hostname: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-club360_root_change_me}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-club360}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MARIADB_ROOT_PASSWORD:-club360_root_change_me}
      DB_NAME: ${MARIADB_DATABASE:-club360}
      BACKUP_DIR: /backups
      RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-8}
      BACKUPS_ENABLED: ${BACKUPS_ENABLED:-true}
    volumes:
      - club360_mariadb_data:/var/lib/mysql
      - ../Backups:/backups
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mariadb-admin ping -h 127.0.0.1 -uroot -p"$$MARIADB_ROOT_PASSWORD" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      club360:
        aliases:
          - mariadb

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: club360-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: ${MARIADB_ROOT_PASSWORD:-club360_root_change_me}
      DATABASE_NAME: ${MARIADB_DATABASE:-club360}
      DATABASE_URL: mysql://root:${MARIADB_ROOT_PASSWORD:-club360_root_change_me}@db:3306/${MARIADB_DATABASE:-club360}
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en deploy/.env}
      JWT_ACCESS_SECONDS: ${JWT_ACCESS_SECONDS:-1800}
      JWT_REFRESH_SECONDS: ${JWT_REFRESH_SECONDS:-604800}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CLUB360_AUTO_INSTALL: ${CLUB360_AUTO_INSTALL:-0}
      CLUB360_DOCKER: "1"
    volumes:
      - club360_backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3000/api/install/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - club360

  redis:
    image: redis:7-alpine
    container_name: club360-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - club360_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - club360

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_APP_VERSION: ${VITE_APP_VERSION:-dev}
    container_name: club360-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - club360

  # Interfaz web para gestionar contenedores, imágenes, volúmenes y logs (sin depender solo de SSH)
  portainer:
    image: portainer/portainer-ce:2.27.3
    container_name: club360-portainer
    restart: unless-stopped
    ports:
      - '${PORTAINER_HTTP_PORT:-9000}:9000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - club360_portainer_data:/data
    networks:
      - club360

  # MCP para agentes externos (Telegram, etc.) — solo localhost; Cloudflare → :3100
  mcp:
    build:
      context: ..
      dockerfile: mcp-server/Dockerfile
    container_name: club360-mcp
    restart: unless-stopped
    environment:
      CLUB360_API_URL: http://api:3000/api
      CLUB360_USERNAME: ${MCP_CLUB360_USERNAME:-admin}
      CLUB360_PASSWORD: ${MCP_CLUB360_PASSWORD:?Definir MCP_CLUB360_PASSWORD en deploy/.env}
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3100
      MCP_HTTP_BEARER_TOKEN: ${MCP_HTTP_BEARER_TOKEN:?Definir MCP_HTTP_BEARER_TOKEN en deploy/.env}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://mcp.unogym.online}
      CLUB360_REQUEST_TIMEOUT_MS: ${CLUB360_REQUEST_TIMEOUT_MS:-30000}
    ports:
      - '127.0.0.1:3100:3100'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - club360

volumes:
  club360_mariadb_data:
    name: club360_mariadb_data
  club360_backend_data:
    name: club360_backend_data
  club360_portainer_data:
    name: club360_portainer_data
  club360_redis_data:
    name: club360_redis_data

networks:
  club360:
    name: club360
