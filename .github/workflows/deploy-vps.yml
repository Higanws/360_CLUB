# Al publicar un tag v* (ej. v1.0.0), despliega en el VPS vía SSH.
#
# Secrets en GitHub → Settings → Secrets → Actions:
#   VPS_HOST      → 187.33.154.45
#   VPS_SSH_KEY   → contenido de la clave privada SSH (PEM)
#   VPS_USER      → root (opcional; default root)
#
# También: Run workflow manual (rama o tag).

name: Deploy VPS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag o rama a desplegar (ej. v1.0.0 o main)'
        required: true
        default: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            REF="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref_name }}"
            chmod +x /opt/360_CLUB/deploy/vps-deploy.sh
            /opt/360_CLUB/deploy/vps-deploy.sh "${REF}"
