# Al publicar un tag v* (ej. v1.0.0), despliega en el VPS vía SSH.
#
# Secrets (Settings → Secrets → Actions):
#   VPS_HOST      → 187.33.154.45  (sin https:// ni espacios)
#   VPS_SSH_KEY   → clave PRIVADA completa (cloudflare.pem), con saltos de línea
#   VPS_USER      → root
#
# Pegar clave en Mac: pbcopy < /Users/Personal/Downloads/cloudflare.pem

name: Deploy VPS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag o rama a desplegar (ej. v1.0.0 o main)'
        required: true
        default: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Comprobar conexión
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          USER="${VPS_USER:-root}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${USER}@${VPS_HOST}" 'echo "SSH OK en $(hostname)"'

      - name: Desplegar en VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          USER="${VPS_USER:-root}"
          ssh -o BatchMode=yes "${USER}@${VPS_HOST}" \
            "chmod +x /opt/360_CLUB/deploy/vps-deploy.sh && /opt/360_CLUB/deploy/vps-deploy.sh '${DEPLOY_REF}'"
